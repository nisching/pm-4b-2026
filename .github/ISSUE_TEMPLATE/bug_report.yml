
name: "Bug Report"
description: "Vorlage für einen neuen Bug Report"

body:
  - type: input
    id: beschreibung
    attributes:
      label: "Beschreibung"
      placeholder: "Gib hier deinen Text ein"
    validations:
      required: true

  - type: dropdown
    id: prioritaet
    attributes:
      label: "Priorität"
      options:
        - Niedrig
        - Mittel
        - Hoch
    validations:
      required: true
